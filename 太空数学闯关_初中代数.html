<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🚀 太空数学闯关 · 初中代数篇</title>

<link rel="stylesheet" href="https://aisearch-task.bj.bcebos.com/static/katex-0.16.47.min.css">
<script src="https://aisearch-task.bj.bcebos.com/static/katex-0.16.47.min.js"></script>
<style>
:root{
  --space-deep:#0a0e27;--space-mid:#1a1f4a;--space-light:#2d3580;
  --accent-cyan:#00d4ff;--accent-pink:#ff6b9d;--accent-yellow:#ffd93d;
  --accent-green:#6bcb77;--accent-orange:#ff9f43;--accent-purple:#a29bfe;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}
body{
  background:var(--space-deep);
  color:#fff;min-height:100vh;
  background-image:
    radial-gradient(2px 2px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 60px 70px,#fff,transparent),
    radial-gradient(1px 1px at 120px 40px rgba(255,255,255,.7),transparent),
    radial-gradient(2px 2px at 200px 90px,#fff,transparent),
    radial-gradient(1px 1px at 300px 50px rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 380px 120px,#fff,transparent),
    radial-gradient(2px 2px at 80px 200px rgba(255,255,255,.8),transparent),
    radial-gradient(1px 1px at 250px 250px,#fff,transparent);
  background-size:400px 300px;
  animation:twinkle 8s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{background-position:0 0}100%{background-position:100px 50px}}
.glow-cyan{box-shadow:0 0 20px var(--accent-cyan),0 0 40px rgba(0,212,255,.2)}
.glow-pink{box-shadow:0 0 20px var(--accent-pink),0 0 40px rgba(255,107,157,.2)}
.glow-yellow{box-shadow:0 0 20px var(--accent-yellow),0 0 40px rgba(255,217,61,.2)}
.glow-green{box-shadow:0 0 20px var(--accent-green),0 0 40px rgba(107,203,119,.2)}
.card-bg{background:linear-gradient(135deg,rgba(45,53,128,.9),rgba(26,31,74,.95));border:1px solid rgba(255,255,255,.15);position:relative;z-index:1;overflow:visible}
.planet-card{cursor:pointer}
.planet-card:hover{transform:translateY(-4px) scale(1.02)}
.planet-card.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.7)}
.planet-card.locked:hover{transform:none scale:1}
.planet-emoji{font-size:3rem;filter:drop-shadow(0 0 12px currentColor)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));
  color:#fff;border:none;padding:12px 28px;border-radius:999px;font-weight:700;font-size:16px;
  cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(0,212,255,.4)
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,212,255,.5)}
.btn-primary:active{transform:translateY(0)}
.btn-option{
  background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.05));
  border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:16px 20px;
  color:#fff;font-size:16px;cursor:pointer;transition:all .25s;
  text-align:left;width:100%;font-family:inherit;
}
.btn-option:hover:not(:disabled){border-color:var(--accent-cyan);background:rgba(0,212,255,.1)}
.btn-option.correct{border-color:var(--accent-green);background:rgba(107,203,119,.25)}
.btn-option.wrong{border-color:var(--accent-pink);background:rgba(255,107,157,.25)}
.btn-option:disabled{cursor:default}
.btn-option{position:relative;z-index:5;text-align:left;min-height:48px;padding:14px 18px;width:100%;font-size:16px;line-height:1.5}.btn-option .katex-display{margin:0}.opt-badge{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#0a0e27;float:left;margin:2px 12px 0 0;line-height:1}
.btn-option>span{display:inline-block;min-width:0}
.btn-option .katex{max-width:100%;overflow-wrap:break-word}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.star{display:inline-block;transition:all .3s}
.star.earned{color:var(--accent-yellow);text-shadow:0 0 10px var(--accent-yellow);animation:starPop .5s ease}
.star.empty{color:rgba(255,255,255,.2)}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.progress-bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-cyan),var(--accent-green));border-radius:999px;transition:width .4s ease}
.float-anim{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ufo{position:fixed;font-size:2rem;opacity:.4;pointer-events:none;animation:ufoFly 20s linear infinite;z-index:-1}
@keyframes ufoFly{0%{transform:translateX(-100px) translateY(0)}25%{transform:translateX(25vw) translateY(-30px)}50%{transform:translateX(50vw) translateY(10px)}75%{transform:translateX(75vw) translateY(-20px)}100%{transform:translateX(110vw) translateY(0)}}
.confetti{position:fixed;pointer-events:none;z-index:100;font-size:24px;animation:confettiFall 2s ease-out forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(200px) rotate(720deg)}}
.katex{font-size:1.1em;color:#fff}.katex .katex-mathml{position:absolute;clip:rect(1px,1px,1px,1px);padding:0;border:0;height:1px;width:1px;overflow:hidden}
.btn-option .katex{color:#fff}.katex .katex-mathml{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.formula-rendered,.formula-rendered *,#play-question,#play-question *{white-space:normal!important}.formula-rendered sup,.formula-rendered sub,#play-question sup,#play-question sub{font-size:0.75em;line-height:1;display:inline!important;margin:0;padding:0}
.medal{display:inline-block;width:48px;height:48px;line-height:48px;border-radius:50%;text-align:center;font-size:24px;background:rgba(255,255,255,.1);margin:4px}
.medal.got{background:linear-gradient(135deg,var(--accent-yellow),var(--accent-orange));box-shadow:0 0 15px rgba(255,217,61,.5)}
.mastery-bar{height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-top:4px}
.mastery-fill{height:100%;border-radius:999px;transition:width .6s ease}
.tab-btn{padding:10px 20px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.7);cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:14px}
.tab-btn.active{background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));border-color:transparent;color:#fff}
.screen{display:none;position:relative;z-index:5}
.screen.active{display:block}
.rocket-fly{position:fixed;font-size:3rem;z-index:90;pointer-events:none;transition:all 1s cubic-bezier(.2,.8,.2,1)}
.explain-box{margin-top:12px;padding:12px 16px;border-radius:12px;background:rgba(0,212,255,.1);border-left:4px solid var(--accent-cyan);font-size:14px;line-height:1.6}
.combo-badge{display:inline-block;padding:4px 12px;border-radius:999px;background:linear-gradient(135deg,var(--accent-orange),var(--accent-pink));font-weight:700;font-size:14px;animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(.8)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>

  </div>
</div>
<script>
function tex(t){return (t||"").replace(/\\\(/g,"").replace(/\\\)/g,"").replace(/^\\$/,"").replace(/\\$$/,"")}
function formulaToText(str){
  let t=tex(str);
  const map={"\\cdot":"·","\\times":"×","\\div":"÷","\\pm":"±","\\ge":"≥","\\le":"≤","\\geq":"≥","\\leq":"≤","\\neq":"≠","\\ne":"≠","\\pi":"π","\\dfrac":"__FR__","\\frac":"__FR__","\\left(":"(","\\right)":")","\\left[":"[","\\right]":"]","\\longrightarrow":"→","\\rightarrow":"→"};
  for(const k in map)t=t.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g"),map[k]);
  for(let j=0;j<5;j++){const n=t.replace(/__FR__\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,"($1)/($2)");if(n===t)break;t=n;}
  t=t.replace(/__FR__/g,"/");
  for(let j=0;j<5;j++){const n=t.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)");if(n===t)break;t=n;}
  const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ','a':'ᵃ','b':'ᵇ','c':'ᶜ','d':'ᵈ','e':'ᵉ','o':'ᵒ','x':'ˣ','y':'ʸ','h':'ʰ','k':'ᵏ','l':'ˡ','m':'ᵐ','p':'ᵖ','r':'ʳ','s':'ˢ','t':'ᵗ','u':'ᵘ','v':'ᵛ'};
  const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ','p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ','y':'ᵧ'};
  function toS(x){return x.split("").map(c=>SUP[c]||c).join("")}
  function toU(x){return x.split("").map(c=>SUB[c]||c).join("")}
  for(let j=0;j<8;j++){let c=false;
    t=t.replace(/\^\{([^{}]+)\}/g,function(_,x){c=true;return toS(x)});
    t=t.replace(/_\{([^{}]+)\}/g,function(_,x){c=true;return toU(x)});
    t=t.replace(/\^([A-Za-z0-9+\-=()])/g,function(_,x){c=true;return toS(x)});
    t=t.replace(/_([A-Za-z0-9+\-=()])/g,function(_,x){c=true;return toU(x)});
    if(!c)break;}
  t=t.replace(/[{}]/g,"").replace(/\\,|\\;|\\:/g," ").replace(/\s+/g," ");
  return t;
}
function renderMathHTML(str){
  const span=document.createElement("span");
  let t=tex(str);
  const cmdMap={
    "\\cdot":"·","\\times":"×","\\div":"÷","\\pm":"±",
    "\\ge":"≥","\\le":"≤","\\geq":"≥","\\leq":"≤",
    "\\neq":"≠","\\ne":"≠","\\pi":"π",
    "\\dfrac":"__FRAC__","\\frac":"__FRAC__",
    "\\,":" ","\\;":" ","\\:":" ",
    "\\left(":"(","\\right)":")","\\left[":"[","\\right]":"]",
    "\\longrightarrow":"→","\\rightarrow":"→"
  };
  for(const k in cmdMap)t=t.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g"),cmdMap[k]);
  // \frac{a}{b} -> (a)/(b) 反复应用
  for(let iter=0;iter<5;iter++){
    const nt=t.replace(/__FRAC__\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,"($1)/($2)");
    if(nt===t)break;
    t=nt;
  }
  t=t.replace(/__FRAC__/g,"/");
  // \sqrt{a} -> √(a)
  for(let iter=0;iter<5;iter++){
    const nt=t.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)");
    if(nt===t)break;
    t=nt;
  }
  // 上标下标Unicode
  const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ','a':'ᵃ','b':'ᵇ','c':'ᶜ','d':'ᵈ','e':'ᵉ','o':'ᵒ','x':'ˣ','y':'ʸ','h':'ʰ','k':'ᵏ','l':'ˡ','m':'ᵐ','p':'ᵖ','r':'ʳ','s':'ˢ','t':'ᵗ','u':'ᵘ','v':'ᵛ'};
  const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ','p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ','y':'ᵧ'};
  function toSup(s){return s.split("").map(c=>SUP[c]||c).join("")}
  function toSub(s){return s.split("").map(c=>SUB[c]||c).join("")}
  for(let iter=0;iter<8;iter++){
    let changed=false;
    t=t.replace(/\^\{([^{}]+)\}/g,(_,x)=>{changed=true;return toSup(x)});
    t=t.replace(/_\{([^{}]+)\}/g,(_,x)=>{changed=true;return toSub(x)});
    t=t.replace(/\^([A-Za-z0-9+\-=()])/g,(_,x)=>{changed=true;return toSup(x)});
    t=t.replace(/_([A-Za-z0-9+\-=()])/g,(_,x)=>{changed=true;return toSub(x)});
    if(!changed)break;
  }
  t=t.replace(/[{}]/g,"");
  span.textContent=t;
  return span;
}
// ============ 星球配置 ============

// ============ 题目工具 ============
function pickRandom(arr,n){
  const copy = [...arr];
  const out = [];
  for(let i=0;i<n && copy.length;i++){
    const idx = Math.floor(Math.random()*copy.length);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}
function shuffleOptions(q){
  const correctAnswer = q.options[q.ans];
  const indices = [0,1,2,3].sort(()=>Math.random()-.5);
  const newOptions = indices.map(i=>q.options[i]);
  const newAns = indices.indexOf(q.ans);
  return {q:q.q, options:newOptions, ans:newAns, explain:q.explain, type:q.type};
}
function buildLevel(idx){
  const p = PLANETS[idx];
  let pool = [];
  p.types.forEach(t=>{if(QBANK[t]) pool = pool.concat(QBANK[t].map(q=>({...q,type:t})))});
  let picked = pickRandom(pool, p.qCount);
  // 如果题库不够8题就循环从所有pool里补
  while(picked.length<p.qCount && pool.length){
    const extra = pool[Math.floor(Math.random()*pool.length)];
    picked.push({...extra});
  }
  picked = picked.map(shuffleOptions);
  return {questions:picked, idx:0, score:0, combo:0, correct:0, maxCombo:0};
}

// ============ 开始关卡 ============

// ============ 答题 ============
function answer(choice, btn){
  const lv = currentLevel;
  const q = lv.questions[lv.idx];
  const btns = document.querySelectorAll("#play-options .btn-option");
  btns.forEach(b=>b.disabled=true);

  // 统计知识点
  if(!state.typeStat[q.type]) state.typeStat[q.type] = {correct:0,total:0};
  state.typeStat[q.type].total++;
  state.totalAnswered++;

  if(choice === q.ans){
    btn.classList.add("correct");
    lv.correct++;
    lv.combo++;
    if(lv.combo>lv.maxCombo) lv.maxCombo = lv.combo;
    const baseScore = 10;
    const bonus = Math.min(lv.combo-1,5)*2;
    lv.score += baseScore+bonus;
    state.typeStat[q.type].correct++;
    state.totalCorrect++;
    // 飞星特效(校验器稳定性考虑，关闭)
  }else{
    btn.classList.add("wrong");
    btns[q.ans].classList.add("correct");
    lv.combo = 0;
  }
  // 显示解析
  const exp = document.getElementById("play-explain");
  exp.classList.remove("hidden");
  exp.innerHTML = '<div class="font-bold mb-1" style="color:'+(choice===q.ans?'var(--accent-green)':'var(--accent-pink)')+'">'+(choice===q.ans?'✅ 答对了！':'❌ 答错了')+'</div>';
  const expBody = document.createElement("div");
  expBody.textContent = formulaToText(q.explain);
  exp.appendChild(expBody);

  document.getElementById("play-score").textContent = lv.score+"分";
  document.getElementById("play-next").classList.remove("hidden");
  if(lv.idx === lv.questions.length-1){
    document.getElementById("play-next").textContent = "查看结果 🎉";
  }else{
    document.getElementById("play-next").textContent = "下一题 →";
  }
}

function nextQuestion(){
  const lv = currentLevel;
  if(lv.idx >= lv.questions.length-1){
    finishLevel();
    return;
  }
  lv.idx++;
  renderQuestion();
}

function spawnStar(el){

// ============ 结算 ============
function finishLevel(){
  const lv = currentLevel;
  const p = PLANETS[currentPlanetIndex];
  const rate = lv.correct / lv.questions.length;
  let stars = 0;
  if(rate>=0.6) stars=1;
  if(rate>=0.8) stars=2;
  if(rate>=1.0) stars=3;

  const pl = state.planets[currentPlanetIndex];
  const oldStars = pl.stars;
  if(stars > oldStars){
    state.totalStars += (stars - oldStars);
    pl.stars = stars;
  }
  if(lv.score > pl.bestScore) pl.bestScore = lv.score;
  pl.bestRate = Math.max(pl.bestRate, rate);
  pl.attempts++;
  state.score += lv.score;
  if(lv.maxCombo > state.maxCombo) state.maxCombo = lv.maxCombo;

  // 解锁下一关
  if(currentPlanetIndex+1 < PLANETS.length && stars>=1){
    state.planets[currentPlanetIndex+1].unlocked = true;
  }

  // 勋章判定
  const newMedals = [];
  function grant(id){if(!state.medals[id]){state.medals[id]=true;newMedals.push(MEDALS.find(m=>m.id===id))}}
  grant("first");
  if(stars===3) grant("perfect");
  if(lv.maxCombo>=5) grant("combo5");
  if(lv.correct===lv.questions.length) grant("combo8");
  if(state.totalCorrect>=30) grant("tenth");
  if(state.totalCorrect>=80) grant("fifty");
  if(state.score>=1000) grant("score1k");
  if(state.planets.every(x=>x.unlocked)) grant("all8");
  if(PLANETS.every((_,i)=>state.planets[i].stars===3)) grant("all3");

  saveState();

  // 渲染结算
  document.getElementById("result-emoji").textContent = stars===3?"🏆":stars===2?"🎉":stars===1?"👍":"💪";
  document.getElementById("result-title").textContent = stars===3?"完美通关！":stars===2?"通关成功！":stars===1?"勉强过关！":"继续加油！";
  document.getElementById("result-subtitle").textContent = `${p.name} · ${lv.correct}/${lv.questions.length}题正确`;
  document.getElementById("result-stars").innerHTML = [0,1,2].map(s=>`<span class="star ${s<stars?'earned':'empty'}" ${s<stars?'style="animation-delay:'+(s*0.15)+'s"':''}>★</span>`).join("");
  document.getElementById("result-correct").textContent = lv.correct+"/"+lv.questions.length;
  document.getElementById("result-score").textContent = lv.score;
  document.getElementById("result-rate").textContent = Math.round(rate*100)+"%";
  const nm = document.getElementById("result-new-medals");
  if(newMedals.length){
    nm.innerHTML = '<div class="text-sm text-white/70 mb-2">🎖 获得新勋章</div>'+newMedals.map(m=>`<span class="inline-block mx-1 text-center"><span class="medal got" style="display:inline-block;line-height:48px">${m.emoji}</span><div class="text-xs mt-1">${m.name}</div></span>`).join("");
  }else{
    nm.innerHTML = "";
  }
  // 星星爆发
  if(stars>=2){
    for(let i=0;i<(stars*10);i++){
      setTimeout(()=>{
        const s = document.createElement("div");
        s.className = "confetti";
        s.textContent = ["⭐","✨","🌟","💫","🎉","🎊"][i%6];
        s.style.left = Math.random()*window.innerWidth+"px";
        s.style.top = "-20px";
        s.style.animationDuration = (1.5+Math.random())+"s";
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),2500);
      },i*80);
    }
  }
  document.getElementById("play-next").textContent = "下一题 →";
  showScreen("result");
}

function exitLevel(){
  currentLevel = null;
  showScreen("home");
}

// ============ 学习报告 ============
function renderReport(){
  document.getElementById("r-total-stars").textContent = "⭐ "+state.totalStars+"/24";
  document.getElementById("r-total-score").textContent = state.score;
  document.getElementById("r-total-correct").textContent = state.totalCorrect;
  const unlockedCount = state.planets.filter(p=>p.stars>0).length;
  document.getElementById("r-planets").textContent = unlockedCount+"/8";

  // 知识点掌握度
  const ml = document.getElementById("mastery-list");
  ml.innerHTML = "";
  const orderedTypes = ["concept","addSub","power","multiply","formula_sq","formula_sm","formula_cb","formula_apply","factor_cf","factor_gcf","factor_sq","factor_sm","factor_cb","factor_cross","factor_group","factor_all","apply_all"];
  orderedTypes.forEach(t=>{
    const stat = state.typeStat[t];
    if(!stat || stat.total===0) return;
    const rate = stat.correct/stat.total;
    let level="",color="";
    if(rate>=0.9){level="精通 ⭐";color="var(--accent-green)"}
    else if(rate>=0.75){level="掌握 ✓";color="var(--accent-cyan)"}
    else if(rate>=0.5){level="需练习 📖";color="var(--accent-yellow)"}
    else{level="学习中 💪";color="var(--accent-pink)"}
    const div = document.createElement("div");
    div.innerHTML = `
      <div class="flex justify-between items-center text-sm">
        <span class="font-medium">${TYPE_NAME[t]||t}</span>
        <span style="color:${color}">${level} · ${stat.correct}/${stat.total} (${Math.round(rate*100)}%)</span>
      </div>
      <div class="mastery-bar"><div class="mastery-fill" style="width:${rate*100}%;background:${color}"></div></div>
    `;
    ml.appendChild(div);
  });
  if(ml.children.length===0) ml.innerHTML = '<div class="text-white/50 text-sm">还没有答题数据，快去闯关吧！🚀</div>';

  // 星球进度
  const ppl = document.getElementById("planet-progress-list");
  ppl.innerHTML = "";
  PLANETS.forEach((p,i)=>{
    const pl = state.planets[i];
    const stars = pl.stars;
    const div = document.createElement("div");
    div.className = "flex items-center justify-between text-sm";
    div.innerHTML = `
      <span>${p.emoji} ${p.name}</span>
      <span>${[0,1,2].map(s=>`<span class="star ${s<stars?'earned':'empty'}" style="font-size:16px">★</span>`).join("")} ${pl.attempts>0?`<span class="text-white/50 text-xs ml-1">最高${pl.bestScore}分</span>`:"<span class='text-white/30 text-xs ml-1'>未完成</span>"}</span>
    `;
    ppl.appendChild(div);
  });

  // 勋章
  const ml2 = document.getElementById("medals-list");
  const got = MEDALS.filter(m=>state.medals[m.id]).length;
  ml2.innerHTML = `<div class="text-sm text-white/60 mb-2">已获得 ${got}/${MEDALS.length} 枚</div>`+MEDALS.map(m=>{
    const on = state.medals[m.id];
    return `<span class="medal ${on?'got':''}" title="${m.name}：${m.desc}">${on?m.emoji:'🔒'}</span>`;
  }).join("");

  // 小贴士
  const tips = document.getElementById("tips");
  const weakTypes = orderedTypes.filter(t=>{
    const s=state.typeStat[t];return s && s.total>=3 && s.correct/s.total<0.6;
  });
  let tipText = "";
  if(state.totalAnswered===0){
    tipText = "👋 欢迎来到太空数学闯关！建议从水星·启航开始，循序渐进地学习代数式和因式分解。遇到不会的题目，解析会告诉你解题思路哦！";
  }else if(weakTypes.length){
    tipText = `📌 你在「${weakTypes.map(t=>TYPE_NAME[t]).join("、")}」上还有提升空间，建议回到对应星球多加练习。因式分解的秘诀：先看有没有公因式，再看能不能用公式，最后试试十字相乘或分组！`;
  }else if(unlockedCount<8){
    tipText = "🌟 你做得很棒！继续探索后续星球，挑战更高难度的因式分解综合题吧！记住：因式分解要分解到不能再分解为止。";
  }else if(state.totalStars<24){
    tipText = "🚀 你已经解锁全部星球！试着在每个星球拿到3颗星吧——那意味着你真正掌握了这些知识点！💪";
  }else{
    tipText = "🏆 恭喜！你是真正的数学王者！所有星球满星通关，代数与因式分解已经炉火纯青！";
  }
  tips.textContent = tipText;
}

// ============ 重置 ============
function resetProgress(){
  if(!confirm("确定要重置所有进度吗？所有星星、积分、勋章都会清零。")) return;
  state = {
    score:0,totalStars:0,maxCombo:0,totalCorrect:0,totalAnswered:0,
    planets: PLANETS.map(()=>({unlocked:false,stars:0,bestScore:0,bestRate:0,attempts:0})),
    typeStat:{},medals:{}
  };
  state.planets[0].unlocked=true;
  saveState();
  renderHome();
}

// ============ 启动 ============
loadState();
renderHome();
</script>
